name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Bump version
      id: version
      run: |
        # Read current version from build.gradle
        VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*versionName "\([^"]*\)".*/\1/')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | sed 's/.*versionCode \([0-9]*\).*/\1/')
        
        # Bump patch version
        MAJOR=$(echo $VERSION_NAME | cut -d. -f1)
        MINOR=$(echo $VERSION_NAME | cut -d. -f2)
        PATCH=$(echo $VERSION_NAME | cut -d. -f3)
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        NEW_VERSION_CODE=$((VERSION_CODE + 1))
        
        # Update build.gradle
        sed -i "s/versionCode [0-9]*/versionCode ${NEW_VERSION_CODE}/" app/build.gradle
        sed -i "s/versionName \"[^\"]*\"/versionName \"${NEW_VERSION}\"/" app/build.gradle
        
        # Export for later steps
        echo "version_name=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT
        
        echo "Version bumped: ${VERSION_NAME} (${VERSION_CODE}) -> ${NEW_VERSION} (${NEW_VERSION_CODE})"

    - name: Build Release APK
      id: build
      run: |
        echo "=== Checking environment ==="
        java -version
        echo "=== Building APK ==="
        ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build_output.log
        echo "=== Build exit code: ${PIPESTATUS[0]} ==="
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "Build failed! Last 100 lines of output:"
          tail -100 build_output.log
          exit 1
        fi
        echo "=== APK files generated ==="
        find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || echo "No APK found!"

    - name: Find APK file
      id: apk
      run: |
        APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "ERROR: No APK file found!"
          exit 1
        fi
        echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
        APK_NAME=$(basename "$APK_PATH")
        echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
        echo "Found APK: ${APK_PATH}"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: douyin-tv-${{ steps.version.outputs.version_name }}
        path: ${{ steps.apk.outputs.apk_path }}

    - name: Verify APK signature and checksum
      run: |
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BUILD_TOOLS/apksigner" verify --print-certs "${{ steps.apk.outputs.apk_path }}"
        sha256sum "${{ steps.apk.outputs.apk_path }}" | tee apk_sha256.txt

    - name: Commit version bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle
        git commit -m "chore: bump version to ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }}) [skip ci]" || echo "No changes to commit"
        git push

    - name: Create Git Tag
      run: |
        git tag "v${{ steps.version.outputs.version_name }}"
        git push origin "v${{ steps.version.outputs.version_name }}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.version.outputs.version_name }}"
        name: "DouyinTV v${{ steps.version.outputs.version_name }}"
        body: |
          ## DouyinTV v${{ steps.version.outputs.version_name }}
          
          ### 更新内容
          - 修复部分电视“蓝屏/转圈打不开”：根布局改为 FrameLayout，WebView 不再被加载层挤成 0 高度
          - 修复小米/华为等设备卡顿：取消低配软件渲染与周期性清缓存，改为硬件加速 + 内存压力时按需释放
          - 修复遥控器“只能上下/菜单键无效”：取消按键去抖、扩展菜单键识别、长按 OK 打开设置
          - 新增原生设置菜单：扫码登录、全屏播放、横竖屏/自动旋转、兼容模式、刷新、清缓存、退出
          - 新增空间光标兜底：页面结构变化导致卡片识别失败时，仍可用方向键 + OK 操作
          - 修复验证码无法拖动：支持遥控器 ←/→ 拖动滑块、OK 确认，恢复鼠标拖动
          - 修复视频播放闪退：处理 WebView 渲染进程崩溃并自动重建；全屏视图使用独立容器
          - 旧版 WebView（Chrome < 80）自动启用兼容模式并提示更新 Android System WebView
          - APK 同时使用 v1/v2/v3 签名，改善 Fire TV / 老设备安装解析失败问题
          
          ### 安装说明
          1. 下载 APK 文件（SHA-256 校验值见构建日志）
          2. 通过 U 盘安装到电视
          3. 允许安装未知来源应用
          4. 启动应用开始使用
          5. 按键：方向键移动 · OK 确认 · 长按 OK 打开设置
        files: |
          ${{ steps.apk.outputs.apk_path }}
          apk_sha256.txt
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
